[package]
name = "gmap"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
authors = ["pimarawan"]
description = "Find the risky parts of a git repository: hotspots, hidden coupling and the truck factor"
license = "MIT"
repository = "https://github.com/pimarawan/gmap"
readme = "README.md"
keywords = ["git", "hotspots", "truck-factor", "coupling", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/doc", "/.github", "/PKGBUILD", "/.SRCINFO"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crossterm = "0.29"
gix = { version = "0.90", default-features = false, features = ["max-performance", "sha1", "blob-diff", "mailmap", "revision"] }
globset = "0.4"
imara-diff = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
